name: Vericore branding audit

on:
  push:
    branches: [chore/migrate-codecontext-to-vericore]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify no legacy branding remains
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'CodeContext|codecontext|CODECONTEXT|CodeContext-Website'; then
            echo 'Legacy CodeContext branding remains.'
            exit 1
          fi
          echo 'No legacy CodeContext branding remains in the repository snapshot.'
